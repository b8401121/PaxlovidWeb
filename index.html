<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paxlovid 用藥交互作用警示篩選系統</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="theme-eyecare">
  <div class="app-container">
    <header class="app-header">
      <div class="app-title-group">
        <img src="wu_ent_logo.jpg" alt="吳鎮宇親子耳鼻喉科診所 Logo" class="app-logo">
        <div>
          <span class="app-badge">吳鎮宇親子耳鼻喉科診所</span>
          <h1>Paxlovid (Nirmatrelvir/Ritonavir) 用藥交互作用警示篩選系統</h1>
        </div>
      </div>
      <div class="theme-toggle-group">
        <button id="theme-light">☀️ 臨床明亮</button>
        <button id="theme-eyecare" class="active">🍵 護眼溫和</button>
        <button id="theme-dark">🌙 臨床深色</button>
      </div>
    </header>

    <main class="app-main">
      <div class="card input-area">
        <textarea id="search-input" placeholder="請在此貼上健保雲端藥歷文字... (自動過濾非藥品資訊)"></textarea>
        <div style="display: flex; gap: 12px;">
          <button id="btn-paste" class="btn-primary">📋 一鍵貼上雲端藥歷 / 分析</button>
          <button id="btn-clear" class="btn-secondary">🧹 清除重置</button>
        </div>
      </div>

      <div class="card results-area hidden" id="results-container">
        <div class="tabs">
          <button class="tab-btn active" data-target="tab-auto">🔍 雲端藥歷自動化解析</button>
          <button class="tab-btn" data-target="tab-manual">📝 原始解析列表</button>
        </div>

        <div id="tab-auto" class="tab-content active">
          <div id="category-results">
            <!-- 動態插入分類結果 -->
          </div>
        </div>

        <div id="tab-manual" class="tab-content">
          <div style="overflow-x: auto;">
            <table>
              <thead>
                <tr>
                  <th>處方日期</th>
                  <th>藥名 (原始文字)</th>
                  <th>學名 (Generic)</th>
                  <th>商品名 (Brand)</th>
                  <th>建議與禁忌</th>
                </tr>
              </thead>
              <tbody id="manual-table-body">
                <!-- 動態插入表格資料 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      Paxlovid Drug-Drug Interaction Checker | 吳鎮宇耳鼻喉科診所 專用獨立版
    </footer>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
